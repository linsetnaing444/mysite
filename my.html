<!DOCTYPE>
<html>
     <head>
     <meta charset="UTF-8">
     <title>my class</title>
<style>     
body { 
       width: 100vh;
       height: 100%;
       background-color: gray;
       padding: 20px;
       margin: 0px;
       display: flex;
       justify-content: center;
       align-items: center;
       text-align: center;
       font-family: sans-serif;
     }

.box  {
       background-color: pink;
       width: 60vh;
       height: 60%;
       text-align: center;
       align-items: center;
       display: flex;
       padding: 20px;
       margin: 20px;
       box-shadow: 10px;
       border: 1px solid black;
       border-radius: 0 5px 3px rgba(0,0,0,0,1);
      }

input {
        background-color: white;
        color: black;
        display: block;
        width: 350px;
        height: 80px;
        padding: 15px;
        margin: 10px;
        text-align: center;
        align-items: center;
      }

button  {
          background-color: white;
          color: black;
          width: 85px;
          height: 55px;
          margin: 10px;
        }
</style>
     </head>
      <body>
           <div class="box"> 
           <input type="text" name="name" placeholder="your name">
           <input type="number" name="number" placeholder="enter phone number">
           <button>Next</button>
           </div>
      <script>
           alert("hello မင်္ဂလာပါ")
      </script>
      </body>
</html>
